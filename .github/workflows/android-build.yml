name: Build UZ Pro Football APK

on:
  workflow_dispatch:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android


      - name: Create Web Folder
        run: |
          mkdir www
          cp -r index.html style.css script.js assets pages www/


      - name: Initialize Capacitor
        run: |
          npx cap init "UZ Pro Football" "com.uzprofootball.app" --web-dir www


      - name: Add Android
        run: |
          npx cap add android


      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          " >> android/build.gradle


      - name: Sync Capacitor
        run: |
          npx cap sync android


      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UZ-Pro-Football-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
