name: Build UZ Pro Football APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin


      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android


      - name: Prepare Web Files
        run: |
          mkdir www
          cp -r index.html style.css script.js assets pages www/


      - name: Create Capacitor Android Project
        run: |
          npx cap init "UZ Pro Football" "com.uzprofootball.app" --web-dir www
          npx cap add android


      - name: Fix Kotlin Version
        run: |
          echo "
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          " >> android/app/build.gradle


      - name: Sync Capacitor
        run: |
          npx cap sync android


      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UZ-Pro-Football-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
