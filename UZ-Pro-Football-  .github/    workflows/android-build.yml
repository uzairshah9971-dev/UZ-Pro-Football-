name: Build UZ Pro Football APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20


    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli


    - name: Create Android Project
      run: |
        npx cap init "UZ Pro Football" "com.uzprofootball.app"
        npx cap add android


    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: UZ-Pro-Football-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
