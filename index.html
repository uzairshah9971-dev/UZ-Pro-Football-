<!DOCTYPE html>
<html>
<head>
<title>UZ Pro Football</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<h1>⚽ UZ Pro Football</h1>

<p class="subtitle">
Become a better football player
</p>


<div class="profile">
<h2>Enter Your Name</h2>

<input id="playerName" placeholder="Your name">

<button onclick="startTraining()">
Start Training
</button>

</div>


<div id="dashboard" class="hidden">

<h2>Training Dashboard</h2>

<div class="cards">

<div class="card">
🎯
<h3>Shooting</h3>
</div>


<div class="card">
👟
<h3>Dribbling</h3>
</div>


<div class="card">
⚽
<h3>Passing</h3>
</div>


<div class="card">
🏃
<h3>Speed</h3>
</div>


<div class="card">
💪
<h3>Fitness</h3>
</div>


<div class="card">
🍎
<h3>Nutrition</h3>
</div>


</div>

</div>

</div>


<script src="script.js"></script>

</body>
</html>
